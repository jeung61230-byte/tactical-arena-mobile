<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>TACTICAL ARENA</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080e18;color:#eef5ff;font-family:system-ui,-apple-system,sans-serif;touch-action:none}
#game{display:block;width:100vw;height:100dvh;touch-action:none;background:#111b2b}
#hud{position:fixed;inset:0;pointer-events:none}
.panel{background:rgba(7,13,24,.72);border:1px solid rgba(170,210,255,.28);border-radius:12px;padding:8px 11px;backdrop-filter:blur(5px);text-shadow:0 1px 3px #000}
#top{position:absolute;top:env(safe-area-inset-top,8px);left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;font-size:12px}
#healthbar{width:100px;height:7px;background:#3c2533;border-radius:8px;margin-top:5px;overflow:hidden}
#healthfill{height:100%;width:100%;background:#55e6a5}
#crosshair{position:absolute;left:50%;top:48%;width:22px;height:22px;transform:translate(-50%,-50%)}
#crosshair:before,#crosshair:after{content:"";position:absolute;background:#e7f6ff;box-shadow:0 0 5px #63d7ff}
#crosshair:before{width:2px;height:22px;left:10px;top:0}
#crosshair:after{height:2px;width:22px;top:10px;left:0}
#bottom{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);left:12px;right:12px;display:flex;justify-content:space-between;align-items:end}
#leftControls{display:flex;gap:10px;align-items:end}
#stick{width:112px;height:112px;border-radius:50%;border:2px solid #a9d8f766;background:#9acaff15;position:relative;pointer-events:auto;touch-action:none}
#knob{position:absolute;width:42px;height:42px;border-radius:50%;background:#9edbff99;border:2px solid #e2f7ff;left:33px;top:33px;box-shadow:0 0 15px #5ac8ff55}
#rightControls{display:flex;gap:9px;align-items:end;pointer-events:auto}
.btn{border:1px solid #b9e7ff88;background:#17283bdc;color:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;box-shadow:0 4px 16px #0006;touch-action:none;user-select:none}
#fire{width:78px;height:78px;background:linear-gradient(145deg,#ff6e6e,#b82d53);font-size:13px}
#skill{width:58px;height:58px;background:linear-gradient(145deg,#8b8aff,#4648a9);font-size:11px}
#reload{width:48px;height:48px;font-size:10px}
#hint{position:absolute;left:50%;top:62%;transform:translateX(-50%);font-size:11px;color:#d7e8ffb8;text-align:center;white-space:nowrap}
#message{position:absolute;left:50%;top:24%;transform:translateX(-50%);font-weight:900;letter-spacing:2px;font-size:clamp(20px,5vw,34px);text-align:center;text-shadow:0 3px 12px #000;white-space:nowrap}
#start{position:fixed;inset:0;background:linear-gradient(135deg,#09111ff2,#142b43f2);display:flex;align-items:center;justify-content:center;padding:24px;z-index:5}
#card{max-width:420px;width:100%;border:1px solid #7bcfff55;border-radius:22px;padding:25px;background:#0b1727eF;box-shadow:0 20px 80px #0009}
#card h1{margin:0;font-size:30px;letter-spacing:2px;line-height:1.1}
#card p{color:#b6c9df;line-height:1.55;font-size:14px}
#card button{width:100%;padding:15px;border:0;border-radius:12px;color:#06101b;background:linear-gradient(90deg,#72e4ff,#a5f6d3);font-weight:900;font-size:16px}
.small{font-size:11px;color:#8fa8c2}
@media(min-width:700px){#stick{width:130px;height:130px}#knob{left:40px;top:40px}#fire{width:88px;height:88px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div id="top">
    <div class="panel"><b>TACTICAL ARENA</b><div style="color:#9bb7d4;margin-top:3px">TRAINING ZONE · ROUND <span id="round">1</span></div></div>
    <div class="panel" style="min-width:118px"><div>HP <b id="hp">100</b>　 AMMO <b id="ammo">12 / 48</b></div><div id="healthbar"><div id="healthfill"></div></div></div>
    <div class="panel">ELIMS <b id="kills">0</b></div>
  </div>
  <div id="crosshair"></div>
  <div id="message"></div>
  <div id="hint">왼쪽 이동 · 오른쪽 화면 드래그로 조준</div>
  <div id="bottom">
    <div id="leftControls"><div id="stick"><div id="knob"></div></div></div>
    <div id="rightControls">
      <div class="btn" id="reload">재장전</div>
      <div class="btn" id="skill">대시<br>Q</div>
      <div class="btn" id="fire">발사</div>
    </div>
  </div>
</div>
<div id="start"><div id="card">
  <div style="color:#75dfff;font-size:12px;font-weight:800;letter-spacing:3px;margin-bottom:12px">MOBILE FPS · PROTOTYPE</div>
  <h1>TACTICAL<br>ARENA</h1>
  <p>요원 훈련 구역에 들어가 적 봇을 제압해 봐!<br>모바일 FPS 스타일의 팬메이드 연습 게임이야.</p>
  <p>🕹️ 왼쪽 패드: 이동<br>👆 화면 오른쪽을 드래그: 조준 방향<br>🔴 발사: 적을 조준하고 누르기<br>⚡ 대시: 잠깐 빠르게 이동</p>
  <button id="play">훈련 시작</button>
  <div class="small" style="margin-top:12px">터치 조작에 맞춘 브라우저 게임 · 오리지널 프로토타입</div>
</div></div>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let W=0,H=0,dpr=1,playing=false,last=0,round=1,kills=0,hp=100,ammo=12,reserve=48,reloading=false,fireHeld=false,fireTimer=0,damageFlash=0,skillReady=true,skillTime=0;
const player={x:0,y:0,a:0};
let enemies=[],particles=[],keys={},joy={x:0,y:0},lookPointer=null,lookLast={x:0,y:0},stickPointer=null;
const $=id=>document.getElementById(id);
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
function spawn(){enemies=[];const n=Math.min(3+round,8);for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,r=180+Math.random()*260;enemies.push({x:Math.cos(a)*r,y:Math.sin(a)*r,hp:100,a:0,fire:1+Math.random()*2,hit:0})}}
function start(){playing=true;round=1;kills=0;hp=100;ammo=12;reserve=48;player.x=player.y=0;player.a=0;spawn();$('start').style.display='none';$('message').textContent='ROUND 1';setTimeout(()=>{$('message').textContent=''},1100);last=performance.now();requestAnimationFrame(loop)}
$('play').addEventListener('click',start);
function reload(){if(reloading||ammo===12||reserve<=0)return;reloading=true;$('reload').style.opacity=.5;setTimeout(()=>{let n=Math.min(12-ammo,reserve);ammo+=n;reserve-=n;reloading=false;$('reload').style.opacity=1;updateHUD()},850)}
$('reload').addEventListener('pointerdown',e=>{e.preventDefault();reload()});
$('fire').addEventListener('pointerdown',e=>{e.preventDefault();fireHeld=true;shoot()});
for(const ev of ['pointerup','pointercancel','pointerleave'])$('fire').addEventListener(ev,()=>fireHeld=false);
$('skill').addEventListener('pointerdown',e=>{e.preventDefault();if(skillReady&&playing){skillReady=false;skillTime=.22;setTimeout(()=>{skillReady=true},3500);$('skill').style.opacity=.45;setTimeout(()=>$('skill').style.opacity=1,3500)}});
const stick=$('stick'),knob=$('knob');
stick.addEventListener('pointerdown',e=>{e.preventDefault();stickPointer=e.pointerId;stick.setPointerCapture(e.pointerId);moveStick(e)});
stick.addEventListener('pointermove',e=>{if(e.pointerId===stickPointer)moveStick(e)});
function moveStick(e){let r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,max=r.width*.34,len=Math.hypot(dx,dy);if(len>max){dx*=max/len;dy*=max/len}joy.x=dx/max;joy.y=dy/max;knob.style.left=(r.width/2-21+dx)+'px';knob.style.top=(r.height/2-21+dy)+'px'}
function endStick(e){if(e.pointerId===stickPointer){stickPointer=null;joy={x:0,y:0};knob.style.left=(stick.clientWidth/2-21)+'px';knob.style.top=(stick.clientHeight/2-21)+'px'}}
stick.addEventListener('pointerup',endStick);stick.addEventListener('pointercancel',endStick);
canvas.addEventListener('pointerdown',e=>{if(!playing)return;if(e.clientX>W*.35){lookPointer=e.pointerId;lookLast={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId)}});
canvas.addEventListener('pointermove',e=>{if(e.pointerId===lookPointer){let dx=e.clientX-lookLast.x;player.a+=dx*.008;lookLast={x:e.clientX,y:e.clientY}}});
function endLook(e){if(e.pointerId===lookPointer)lookPointer=null}
canvas.addEventListener('pointerup',endLook);canvas.addEventListener('pointercancel',endLook);
function shoot(){if(!playing||reloading)return;if(ammo<=0){reload();return}if(performance.now()-fireTimer<180)return;fireTimer=performance.now();ammo--;let best=null,bestScore=1;for(const en of enemies){if(en.hp<=0)continue;let dx=en.x-player.x,dy=en.y-player.y,dist=Math.hypot(dx,dy),ang=Math.atan2(dy,dx)-player.a;while(ang>Math.PI)ang-=Math.PI*2;while(ang< -Math.PI)ang+=Math.PI*2;let score=Math.abs(ang)+dist*.00045;if(Math.abs(ang)<.20&&score<bestScore){best=en;bestScore=score}}
if(best){best.hp-=50;best.hit=.13;for(let i=0;i<7;i++)particles.push({x:best.x,y:best.y,life:.3+Math.random()*.3,vx:(Math.random()-.5)*100,vy:(Math.random()-.5)*100});if(best.hp<=0){kills++;if(enemies.every(e=>e.hp<=0)){round++;hp=Math.min(100,hp+20);reserve+=12;spawn();$('message').textContent='ROUND '+round;setTimeout(()=>$('message').textContent='',900)}}}updateHUD()}
function updateHUD(){$('hp').textContent=Math.max(0,Math.ceil(hp));$('ammo').textContent=ammo+' / '+reserve;$('kills').textContent=kills;$('round').textContent=round;$('healthfill').style.width=Math.max(0,hp)+'%';$('healthfill').style.background=hp<35?'#ff5d76':'#55e6a5'}
function project(x,y){let dx=x-player.x,dy=y-player.y,c=Math.cos(player.a),s=Math.sin(player.a);return {side:-dx*s+dy*c,depth:dx*c+dy*s}}
function draw(){
ctx.fillStyle='#111b2b';ctx.fillRect(0,0,W,H);
let horizon=H*.47;
let sky=ctx.createLinearGradient(0,0,0,horizon);sky.addColorStop(0,'#101a2c');sky.addColorStop(1,'#263e55');ctx.fillStyle=sky;ctx.fillRect(0,0,W,horizon);
let floor=ctx.createLinearGradient(0,horizon,0,H);floor.addColorStop(0,'#344353');floor.addColorStop(1,'#111b27');ctx.fillStyle=floor;ctx.fillRect(0,horizon,W,H-horizon);
ctx.strokeStyle='#8ab6ce22';ctx.lineWidth=1;
for(let i=1;i<14;i++){let y=horizon+(H-horizon)*i*i/196;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
for(let i=-8;i<=8;i++){ctx.beginPath();ctx.moveTo(W/2+i*W*.06,horizon);ctx.lineTo(W/2+i*W*.2,H);ctx.stroke()}
const fov=W*.72;
let objects=[];
for(let i=-5;i<=5;i++){let x=i*180;for(let y of [-420,420])objects.push({x,y,type:'crate'})}
for(const o of objects){let p=project(o.x,o.y);if(p.depth<30)continue;let sx=W/2+p.side*fov/p.depth,sz=Math.min(H*.65,15000/p.depth),sy=horizon-sz*.55;if(sx<-sz||sx>W+sz)continue;ctx.fillStyle='#1b2a3b';ctx.fillRect(sx-sz*.42,sy,sz*.84,sz);ctx.fillStyle='#40576b';ctx.fillRect(sx-sz*.42,sy,sz*.84,sz*.12);ctx.strokeStyle='#88c4e533';ctx.strokeRect(sx-sz*.42,sy,sz*.84,sz)}
let sorted=enemies.filter(e=>e.hp>0).map(e=>({e,p:project(e.x,e.y)})).filter(o=>o.p.depth>15).sort((a,b)=>b.p.depth-a.p.depth);
for(const {e,p} of sorted){let sx=W/2+p.side*fov/p.depth,scale=Math.min(2.5,250/p.depth),bodyH=120*scale,bodyW=46*scale,sy=horizon-bodyH*.48+20*scale;if(sx<-bodyW||sx>W+bodyW)continue;
ctx.save();ctx.translate(sx,sy);if(e.hit>0)ctx.globalAlpha=.5;
ctx.fillStyle='#e14f70';ctx.beginPath();ctx.ellipse(0,-bodyH*.27,bodyW*.33,bodyW*.38,0,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#8e294c';ctx.fillRect(-bodyW*.45,-bodyH*.04,bodyW*.9,bodyH*.55);
ctx.fillStyle='#ec6c83';ctx.fillRect(-bodyW*.38,bodyH*.05,bodyW*.76,bodyH*.08);
ctx.fillStyle='#182332';ctx.fillRect(-bodyW*.43,bodyH*.48,bodyW*.3,bodyH*.35);ctx.fillRect(bodyW*.13,bodyH*.48,bodyW*.3,bodyH*.35);
ctx.fillStyle='#d7f8ff';ctx.fillRect(-bodyW*.19,-bodyH*.3,bodyW*.13,bodyW*.08);ctx.fillRect(bodyW*.06,-bodyH*.3,bodyW*.13,bodyW*.08);
ctx.fillStyle='#111827';ctx.fillRect(-bodyW*.35,-bodyH*.52,bodyW*.7,5*scale);ctx.fillStyle='#ff637a';ctx.fillRect(-bodyW*.35,-bodyH*.52,bodyW*.7*Math.max(0,e.hp/100),5*scale);
ctx.restore()}
for(const p of particles){let q=project(p.x,p.y);if(q.depth>20){let sx=W/2+q.side*fov/q.depth,sy=horizon-60*fov/q.depth;ctx.fillStyle='#ffcc72';ctx.fillRect(sx,sy,3,3)}}
ctx.strokeStyle='#d6f4ff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(W*.43,H*.83);ctx.lineTo(W*.47,H*.77);ctx.lineTo(W*.53,H*.77);ctx.lineTo(W*.57,H*.83);ctx.stroke();ctx.fillStyle='#0a1422';ctx.fillRect(W*.465,H*.78,W*.07,H*.18);ctx.fillStyle='#334d65';ctx.fillRect(W*.48,H*.8,W*.04,H*.16);
if(damageFlash>0){ctx.fillStyle=`rgba(255,35,70,${damageFlash*.4})`;ctx.fillRect(0,0,W,H)}
}
function loop(t){if(!playing)return;let dt=Math.min((t-last)/1000,.04);last=t;
let speed=150*(skillTime>0?2.5:1);skillTime=Math.max(0,skillTime-dt);
let fx=Math.cos(player.a),fy=Math.sin(player.a),rx=-fy,ry=fx;
player.x+=(fx*(-joy.y)+rx*joy.x)*speed*dt;player.y+=(fy*(-joy.y)+ry*joy.x)*speed*dt;
for(const e of enemies){if(e.hp<=0)continue;e.hit=Math.max(0,e.hit-dt);let dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy);e.a=Math.atan2(dy,dx);if(d>180){e.x+=dx/d*28*dt;e.y+=dy/d*28*dt}e.fire-=dt;if(d<450&&e.fire<=0){e.fire=1.5+Math.random()*1.2;if(Math.random()<.32){hp-=7;damageFlash=.45;updateHUD();if(hp<=0){hp=0;updateHUD();playing=false;$('message').textContent='훈련 종료';$('start').style.display='flex';$('card').querySelector('h1').innerHTML='MISSION<br>FAILED';$('card').querySelector('p').innerHTML='처치 수: '+kills+' · 도달 라운드: '+round;$('play').textContent='다시 도전';return}}}}
for(const p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt}particles=particles.filter(p=>p.life>0);damageFlash=Math.max(0,damageFlash-dt);
if(fireHeld)shoot();draw();requestAnimationFrame(loop)}
})();
</script>
</body>
</html>
